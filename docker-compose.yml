services:
  db:
    image: postgres:15-alpine
    container_name: startupforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: startupforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  neo4j:
    image: neo4j:5-community
    container_name: startupforge-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-startupforge-local}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: startupforge-backend
    ports:
      - "3000:3000"
    environment:
      DB_USER: postgres
      DB_HOST: db
      DB_NAME: startupforge_db
      DB_PASSWORD: password
      DB_PORT: 5432
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-startupforge-local}"
    depends_on:
      - db
      - neo4j
    networks:
      - app-network

  gun_server:
    build: ./gun_server
    container_name: startupforge-gun
    ports:
      - "8765:8765"
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: startupforge-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - app-network

  rag_backend:
    build:
      context: .
      dockerfile: rag_backend/Dockerfile
    container_name: startupforge-rag
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
      GEMINI_FALLBACK_MODEL: "${GEMINI_FALLBACK_MODEL:-gemini-3.8-flash}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-chat-latest}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      ENABLE_MISTRAL_API: "${ENABLE_MISTRAL_API:-false}"
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: startupforge_db
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:0.6b
    depends_on:
      - db
      - ollama
    restart: unless-stopped
    networks:
      - app-network

  prediction_backend:
    build: ./growth_predict/models/investor_backend
    container_name: startupforge-prediction
    ports:
      - "8002:8002"
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: startupforge-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_GUN_URL: http://localhost:8765
      VITE_RAG_API_URL: http://localhost:8000
      VITE_PREDICTION_URL: http://localhost:8002
    depends_on:
      - backend
      - gun_server
      - rag_backend
      - prediction_backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
