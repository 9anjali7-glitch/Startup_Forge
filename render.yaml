services:
  # 1. Main Node.js Backend
  - type: web
    name: startupforge-backend
    env: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: ALLOW_INSECURE_DEMO_LOGIN
        value: "false"
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

  # 2. RAG AI Backend (Python)
  - type: web
    name: startupforge-rag
    env: docker
    dockerContext: .
    dockerfilePath: ./rag_backend/Dockerfile
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: DATABASE_URL
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: chat-latest
      - key: CORS_ORIGINS
        sync: false

  # 3. Prediction Backend (Python)
  - type: web
    name: startupforge-prediction
    env: docker
    dockerContext: ./growth_predict/models/investor_backend
    dockerfilePath: ./growth_predict/models/investor_backend/Dockerfile
    plan: free
    numInstances: 1
    healthCheckPath: /

  # 4. Gun.js Relay
  - type: web
    name: startupforge-gun
    env: docker
    dockerContext: ./gun_server
    dockerfilePath: ./gun_server/Dockerfile
    plan: free
    numInstances: 1

